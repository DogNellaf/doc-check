# Правила проверки договоров ООО «Колосок»: что юрист компании считает риском.
#
# Правило смотрит на каждый пункт договора. scope — регулярное выражение, по которому
# пункт относится к правилу (пусто — подходит любой пункт), pattern — что в нём ищется.
# check:
#   forbid  — нашлось pattern, это риск;
#   require — пункт подходит под scope, но pattern в нём нет;
#   max/min — pattern захватывает число, оно больше limit или меньше limit.
# level: high — нельзя подписывать как есть, medium — нужно согласовать, low — обратить внимание.
# fix — предлагаемая формулировка; без неё в правку идёт подходящий пункт эталона.
# Регистр и буква «ё» не важны: текст сравнивается в нижнем регистре и с «е».

[[rule]]
id = "prepayment"
level = "high"
title = "Предоплата больше 30 %"
pattern = '(\d+(?:[.,]\d+)?)\s*%\s*(?:-\w+\s+)?(?:предоплат|аванс)'
check = "max"
limit = 30
why = "По правилам компании аванс поставщику — не больше 30 % партии. При полной предоплате деньги уходят до проверки товара, а при недопоставке их придётся возвращать претензией и через суд."

[[rule]]
id = "price-unilateral"
level = "high"
title = "Поставщик меняет цену в одностороннем порядке"
pattern = 'одностороннем\s+порядке[^.]{0,80}?(?:измен|повы)\w*[^.]{0,40}?цен|(?:измен|повы)\w*[^.]{0,40}?цен\w*[^.]{0,60}?одностороннем'
check = "forbid"
why = "Цена из спецификации должна держаться до конца её срока. Если поставщик может поднять её уведомлением, бюджет закупок и себестоимость хлеба перестают быть предсказуемыми."

[[rule]]
id = "pay-to-invoice-account"
level = "high"
title = "Оплата на счёт из счёта, а не из договора"
pattern = 'сч[её]т\w*,?\s+указанн\w+\s+в\s+(?:сч[её]те|счетах|счет-фактуре)'
check = "forbid"
why = "Так поставщик может прислать счёт с любыми реквизитами, и оплата по нему будет считаться надлежащей. Мошенники подменяют реквизиты в письмах со счетами, поэтому платим только на счёт из договора."

[[rule]]
id = "buyer-penalty"
level = "high"
title = "Неустойка покупателя выше 0,1 % в день"
scope = 'покупател\w*\s+(?:уплачива|выплачива|оплачива)\w*[^.]{0,40}?(?:неусто|пен[иья])'
pattern = '(\d+(?:[.,]\d+)?)\s*%[^.;]{0,90}?за\s+кажд\w+\s+(?:календарн\w+\s+|рабоч\w+\s+)?д(?:ень|н)'
check = "max"
limit = 0.1
why = "0,1 % в день — обычный для поставок размер, 0,5 % в день — это 182 % годовых. Суд может снизить неустойку, но спорить придётся уже после претензии."

[[rule]]
id = "buyer-penalty-cap"
level = "medium"
title = "Неустойка покупателя без верхнего предела"
scope = 'покупател\w*\s+(?:уплачива|выплачива|оплачива)\w*[^.]{0,40}?(?:неусто|пен[иья])'
pattern = 'не\s+более|не\s+превыша|ограничива'
check = "require"
why = "Без предела неустойка растёт, пока длится просрочка. В эталоне она ограничена 10 % от суммы долга."

[[rule]]
id = "supplier-penalty"
level = "medium"
title = "Неустойка поставщика ниже 0,1 % в день"
scope = 'поставщик\w*\s+(?:уплачива|выплачива)\w*[^.]{0,60}?(?:неусто|пен[иья])'
pattern = '(\d+(?:[.,]\d+)?)\s*%[^.;]{0,90}?за\s+кажд\w+\s+(?:календарн\w+\s+|рабоч\w+\s+)?д(?:ень|н)'
check = "min"
limit = 0.1
why = "Ответственность сторон должна быть зеркальной. Неустойка 0,01 % в день не покрывает простой цеха, когда мука не пришла вовремя."

[[rule]]
id = "claims-hours"
level = "high"
title = "Срок на претензию по качеству в часах"
scope = 'претензи|недостат|качеств'
pattern = 'в\s+течение\s+\d+\s+час'
check = "forbid"
why = "Скрытый брак муки видно только в выпечке, на это уходит больше суток. За часы цех не успеет его обнаружить, и претензию поставщик вправе не принять."

[[rule]]
id = "claims-days"
level = "medium"
title = "Срок на претензию по качеству меньше 10 дней"
scope = 'претензи\w*[^.]{0,30}?качеств|скрыт\w+\s+недостат'
pattern = 'в\s+течение\s+(\d+)\s+(?:рабоч\w+\s+|календарн\w+\s+)?(?:дн|день)'
check = "min"
limit = 10
why = "По эталону о скрытых недостатках сообщаем в течение 10 рабочих дней, за это время партия успевает уйти в производство."

[[rule]]
id = "jurisdiction"
level = "medium"
title = "Споры в суде поставщика"
pattern = 'по\s+месту\s+нахождения\s+поставщика'
check = "forbid"
why = "Судиться в чужом городе дороже: командировки юриста и местный представитель. Эталон — арбитражный суд по месту нахождения покупателя."

[[rule]]
id = "liability-exclusion"
level = "medium"
title = "Поставщик не отвечает за убытки"
pattern = 'поставщик\w*\s+не\s+нес[её]т\s+ответственност|освобожда\w+\s+от\s+(?:возмещения|ответственности\s+за)\s+(?:убытк|упущенн)'
check = "forbid"
why = "Если поставщик сорвёт поставку, пекарня потеряет выручку за смену. Исключение убытков оставляет только неустойку, которая их не покрывает."

[[rule]]
id = "delivery-paid-by-buyer"
level = "medium"
title = "Доставка за счёт покупателя"
pattern = '(?:доставк|транспортн\w+\s+расход|перевозк)\w*[^.]{0,60}?(?:оплачива|возмеща|компенсир)\w*\s+покупател'
check = "forbid"
why = "По эталону доставка, погрузка и разгрузка включены в цену. Отдельные тарифы поставщика делают цену спецификации неполной."

[[rule]]
id = "termination-notice"
level = "medium"
title = "Отказ от договора — больше чем за 30 дней"
scope = 'отказат\w*\s+от\s+(?:договор|исполнени)'
pattern = 'за\s+(\d+)\s+(?:календарн\w+\s+|рабоч\w+\s+)?(?:дн|день)'
check = "max"
limit = 30
why = "Чем дольше срок уведомления, тем дольше нельзя уйти к другому поставщику, если этот перестанет устраивать по цене или качеству."

[[rule]]
id = "termination-debt"
level = "low"
title = "Отказ от договора только без долга"
scope = 'отказат\w*\s+от\s+(?:договор|исполнени)'
pattern = 'только\s+при\s+отсутствии\s+задолженност'
check = "forbid"
why = "Любой спорный счёт становится поводом не отпускать покупателя из договора. В эталоне расчёты закрываются после отказа."

[[rule]]
id = "auto-renewal"
level = "low"
title = "Договор продлевается сам"
pattern = 'продлева\w+\s+на\s+(?:каждый\s+)?(?:следующ|очередн)'
check = "forbid"
why = "Автопродление удобно, но условия при этом не пересматриваются. Поставьте напоминание пересмотреть цены до конца года."
