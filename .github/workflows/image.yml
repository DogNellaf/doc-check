name: Image

# Образ для сервера сайта-портфолио: тег версии v* собирается здесь и кладётся в
# ghcr.io/dognellaf/doc-check:<тег>. Сервер (1 ГБ памяти) только скачивает готовый образ,
# сборка там душила сайт. Run workflow собирает уже существующий тег.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.1.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/dognellaf/doc-check:${{ env.TAG }}
            ghcr.io/dognellaf/doc-check:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
